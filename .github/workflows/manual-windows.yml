name: Manual Build - Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Windows branch
        uses: actions/checkout@v4
        with:
          ref: windows

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Build Windows x64
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Set-Location desktop-agent-go
          $env:GOOS = 'windows'
          $env:GOARCH = 'amd64'
          $env:CGO_ENABLED = '0'
          go build -trimpath -ldflags='-s -w' -o ..\dist\nekopresence-windows-amd64.exe .

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: NekoPresenceKey-Windows-x64
          path: dist/nekopresence-windows-amd64.exe
          if-no-files-found: error
