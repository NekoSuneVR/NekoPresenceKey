name: Build Windows

on:
  push:
    branches: [windows]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Build Windows x64
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Set-Location desktop-agent-go
          $env:GOOS='windows'
          $env:GOARCH='amd64'
          go build -trimpath -ldflags='-s -w' -o ..\dist\nekopresence-windows-amd64.exe .
      - uses: actions/upload-artifact@v4
        with:
          name: nekopresence-windows-amd64
          path: dist/nekopresence-windows-amd64.exe
